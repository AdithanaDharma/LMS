services:
mariadb:
image: 'mariadb:10'
container_name: db
environment:
MYSQL_RANDOM_ROOT_PASSWORD: 1
MYSQL_DATABASE: moodle
MYSQL_USER: moodle
MYSQL_PASSWORD: moodlePassword
volumes:
- $HOME/volumes/mysql:/var/lib/mysql
moodle:
image: 'bitnami/moodle:3'
container_name: moodle
environment:
MOODLE_USERNAME: adithana
MOODLE_PASSWORD: @Thanosh
MOODLE_EMAIL: 2311102207@gmail.com
MARIADB_HOST: db
MARIADB_PORT_NUMBER: 3306
MOODLE_DATABASE_USER: root
MOODLE_DATABASE_NAME: moodle
MOODLE_DATABASE_PASSWORD: moodle-root
ALLOW_EMPTY_PASSWORD: "no"
ports:
- '80:80'
- '443:443'
volumes:
- $HOME/volumes/moodle:/bitnami'
depends_on:
- mariadb
volumes:
mariadb_data:
driver: local
moodle_data:
driver: local
